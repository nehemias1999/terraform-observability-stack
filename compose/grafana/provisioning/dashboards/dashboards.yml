# ==============================================================================
# Description: Grafana dashboard provisioning configuration.
#   Configures automatic loading of dashboards from the dashboards directory.
# Author: Infrastructure Team
# Usage: Referenced by docker-compose.yml as ./grafana/provisioning/dashboards/dashboards.yml
# Dependencies: grafana/grafana:10.1
# ==============================================================================

apiVersion: 1

providers:
  - name: 'Observability Stack Dashboards'
    orgId: 1
    folder: 'Observability'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards