# ==============================================================================
# Description: Traefik static configuration for the observability stack.
#   Defines entrypoints, providers, certificates resolvers, middlewares, and API settings.
# Author: Infrastructure Team
# Usage: Referenced by docker-compose.yml as ./traefik/traefik.yml
# Dependencies: traefik:v3.0
# ==============================================================================

api:
  insecure: true
  dashboard: true

entryPoints:
  web:
    address: ":80"
    # HTTP to HTTPS redirect (simulated via header in dev, real redirect with TLS)
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: observability
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      tlschallenge: true
      email: "${TRAEFIK_ACME_EMAIL:-admin@example.com}"
      storage: "/letsencrypt/acme.json"