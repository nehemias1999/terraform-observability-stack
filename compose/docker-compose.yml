# ==============================================================================
# Description: Docker Compose configuration for the observability stack.
#   Defines all services (Traefik, Prometheus, Grafana, PostgreSQL, App,
#   Node Exporter, Postgres Exporter) with health checks, named volumes,
#   and Traefik routing labels.
# Author: Infrastructure Team
# Usage: docker compose -f compose/docker-compose.yml up -d
# Env Variables: See compose/.env.example for all required variables
# Dependencies: docker, docker-compose-plugin
# ==============================================================================

services:
  # Traefik reverse proxy for HTTP/HTTPS entrypoints and service discovery
  traefik:
    image: traefik:v3.0
    container_name: traefik
    entrypoint: ["/entrypoint.sh"]
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml.tmpl:/etc/traefik/dynamic.yml.tmpl:ro
      - ./traefik/entrypoint.sh:/entrypoint.sh:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - observability
    restart: unless-stopped
    environment:
      - TRAEFIK_DASHBOARD_USER=${TRAEFIK_DASHBOARD_USER:-}
      - TRAEFIK_DASHBOARD_PASSWORD=${TRAEFIK_DASHBOARD_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.middlewares=traefik-dashboard-auth@file"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.47
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./prometheus/entrypoint.sh:/entrypoint.sh:ro
      - prometheus_data:/prometheus
    entrypoint: ["/entrypoint.sh"]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    environment:
      - REMOTE_WRITE_URL=${REMOTE_WRITE_URL:-}
      - REMOTE_WRITE_AUTHORIZATION=${REMOTE_WRITE_AUTHORIZATION:-}
      - REMOTE_WRITE_BASIC_AUTH_USER=${REMOTE_WRITE_BASIC_AUTH_USER:-}
      - REMOTE_WRITE_BASIC_AUTH_PASSWORD=${REMOTE_WRITE_BASIC_AUTH_PASSWORD:-}
      - REMOTE_WRITE_HEADER_CONTENT_TYPE=${REMOTE_WRITE_HEADER_CONTENT_TYPE:-}
      - REMOTE_WRITE_HEADER_CUSTOM=${REMOTE_WRITE_HEADER_CUSTOM:-}
      - REMOTE_WRITE_TLS_INSECURE_SKIP_VERIFY=${REMOTE_WRITE_TLS_INSECURE_SKIP_VERIFY:-}
      - REMOTE_WRITE_TLS_CA_FILE=${REMOTE_WRITE_TLS_CA_FILE:-}
      - REMOTE_WRITE_TLS_CERT_FILE=${REMOTE_WRITE_TLS_CERT_FILE:-}
      - REMOTE_WRITE_TLS_KEY_FILE=${REMOTE_WRITE_TLS_KEY_FILE:-}
    networks:
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # Grafana for dashboards and visualization
  grafana:
    image: grafana/grafana:10.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=${GRAFANA_PLUGINS:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # PostgreSQL for data persistence
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-observability}
      - POSTGRES_USER=${POSTGRES_USER:-observability}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - observability
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observability} -d ${POSTGRES_DB:-observability}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Application service with Prometheus metrics
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app
    networks:
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  # Node Exporter for host metrics
  node-exporter:
    image: prom/node-exporter:v1.6
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Exporter for database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-observability}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-observability}?sslmode=disable
    networks:
      - observability
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postgres-exporter.rule=Host(`postgres-exporter.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.postgres-exporter.entrypoints=web"
      - "traefik.http.services.postgres-exporter.loadbalancer.server.port=9187"

# Named volumes for persistent data
volumes:
  postgres_data:
    name: postgres_data
  grafana_data:
    name: grafana_data
  prometheus_data:
    name: prometheus_data
  traefik_letsencrypt:
    name: traefik_letsencrypt

# Shared network for service communication
networks:
  observability:
    name: observability
    driver: bridge